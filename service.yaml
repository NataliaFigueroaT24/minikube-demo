apiVersion: v1
kind: Service
metadata:
  name: web
  namespace: demo
spec:
  type: NodePort
  selector:
    app: web
  ports:
    - name: http
      port: 80          # puerto del Service (dentro del cluster)
      targetPort: http  # puerto del contenedor (5001, por nombre)
      nodePort: 30080   # puerto expuesto en el nodo (rango 30000-32767)